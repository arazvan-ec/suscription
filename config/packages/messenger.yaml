framework:
    messenger:
        failure_transport: failed

        transports:
            editorial_published:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queues:
                        'queue::event::editorial::published': ~
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

            send_campaign:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queues:
                        'queue::command::send_campaign': ~
                retry_strategy:
                    max_retries: 0

            failed: 'doctrine://default?queue_name=failed'

        routing:
            'App\Application\Message\EditorialPublished': editorial_published
            'App\Application\Message\SendCampaign': send_campaign

when@test:
    framework:
        messenger:
            transports:
                editorial_published: 'in-memory://'
                send_campaign: 'in-memory://'
                failed: 'in-memory://'
